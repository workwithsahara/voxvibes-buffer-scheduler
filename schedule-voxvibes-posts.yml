name: Top up Voxvibes Buffer queue

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, don't create posts)"
        type: boolean
        default: false

jobs:
  schedule-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scheduler
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          BUFFER_MIN_DATE: ${{ secrets.BUFFER_MIN_DATE }}
          BUFFER_CHANNEL_MIN_DATES: ${{ secrets.BUFFER_CHANNEL_MIN_DATES }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          ROOT_FOLDER_ID: ${{ secrets.ROOT_FOLDER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node schedule-voxvibes-posts.js
